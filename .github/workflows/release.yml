name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: amd64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Set version from tag
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python3 - <<'PY'
          import os, re
          from pathlib import Path
          tag = os.environ['RELEASE_TAG']
          if not re.fullmatch(r'v\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?', tag):
              raise SystemExit('Expected vMAJOR.MINOR.PATCH[-prerelease]')
          p = Path('viva.toml')
          p.write_text(re.sub(r'^version = ".*"$', f'version = "{tag[1:]}"', p.read_text(), flags=re.M))
          PY
      - name: Test
        run: go test ./... && go vet ./...
      - name: Build DMG
        run: go run github.com/vivaui/viva/cmd/viva package --target darwin --arch ${{ matrix.arch }} --format dmg
      - uses: actions/upload-artifact@v4
        with:
          name: dmg-${{ matrix.arch }}
          path: outputs/build/*.dmg
          if-no-files-found: error
  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: dmg-*
          merge-multiple: true
          path: dist
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          cd dist
          sha256sum *.dmg > SHA256SUMS.txt
          gh release create "$RELEASE_TAG" *.dmg SHA256SUMS.txt --verify-tag --title "$RELEASE_TAG" --generate-notes
